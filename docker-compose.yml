version: "3.8"

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gen-dnd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      dice-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gen-dnd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # React Frontend (new-frontend)
  frontend:
    build:
      context: ./new-frontend/frontend
      dockerfile: Dockerfile
    container_name: gen-dnd-frontend
    restart: unless-stopped
    networks:
      - gen-dnd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gen-dnd-backend
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - gen-dnd-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Python Dice Agent
  dice-agent:
    build:
      context: ./dice-agent
      dockerfile: Dockerfile
    container_name: gen-dnd-dice-agent
    restart: unless-stopped
    networks:
      - gen-dnd-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/status')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # DynamoDB Local (for development)
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: gen-dnd-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    restart: unless-stopped
    networks:
      - gen-dnd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  gen-dnd-network:
    driver: bridge

volumes:
  dynamodb-data:
    driver: local
